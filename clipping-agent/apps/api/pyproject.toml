[project]
name = "clippy-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "websockets>=12.0",
    "clippy-models>=0.1.0",
    "clippy-config>=0.1.0",
    "clippy-storage>=0.1.0",
    "clippy-database>=0.1.0",
    "clippy-events>=0.1.0",
    "clippy-logging>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
