[project]
name = "clippy-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio>=1.7",
    "openai>=1.0",
    "clippy-models>=0.1.0",
    "clippy-config>=0.1.0",
    "clippy-storage>=0.1.0",
    "clippy-database>=0.1.0",
    "clippy-events>=0.1.0",
    "clippy-logging>=0.1.0",
    "clippy-vectordb>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
