<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Join Free | Opportunity Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<link rel="stylesheet" href="/assets/css/style.css">
</head><body>
<div id="ouHeader"></div>
<main id="main"><div class="u-wrap">
  <form class="u-formcard" data-redirect="/en/register" data-drop="password">
    <h1>Join Free</h1>
    <p class="u-sub">Create a free account to save opportunities and get deadline reminders. Free forever, no card.</p>
    <div class="u-field"><label for="l-email">Email</label><input id="l-email" type="email" name="email" required placeholder="you@example.com"></div>
    <div class="u-field"><label for="l-pass">Password</label><input id="l-pass" type="password" name="password" required placeholder="Your password"></div>
    <div class="u-field"><label for="r-country">Country</label><select id="r-country" name="country"><option value="">Select country</option><option value="in">India</option><option value="ng">Nigeria</option><option value="pk">Pakistan</option><option value="vn">Vietnam</option><option value="id">Indonesia</option><option value="eg">Egypt</option><option value="ke">Kenya</option><option value="gh">Ghana</option><option value="ph">Philippines</option><option value="br">Brazil</option><option value="mx">Mexico</option><option value="tr">Türkiye</option><option value="de">Germany</option><option value="us">United States</option><option value="bd">Bangladesh</option><option value="fr">France</option><option value="jp">Japan</option><option value="gb">United Kingdom</option></select></div>
    <button class="btn btn-primary" type="submit">Create account <i class="fa-solid fa-arrow-right"></i></button>
    <p class="u-form-alt">Already a member? <a href="/en/login">Sign In</a></p>
  </form>
</div></main>
<div id="ouFooter"></div><div id="ouCookie"></div>
<script>window.OU_PAGE={kind:"static"};</script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/components.js"></script>
</body></html>
